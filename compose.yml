services:
  engine:
    image: ernesd5050/rundown-workers:latest
    container_name: rundown-engine
    restart: unless-stopped
    ports:
      - "${RUNDOWN_PORT:-8181}:8181"
    environment:
      RUNDOWN_STORE: postgres
      DATABASE_URL: postgres://rundown:rundown@postgres:5432/rundown?sslmode=disable
      RUNDOWN_HOST: "0.0.0.0"
      RUNDOWN_PORT: "8181"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rundown

  postgres:
    image: postgres:17-alpine
    container_name: rundown-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rundown
      POSTGRES_PASSWORD: rundown
      POSTGRES_DB: rundown
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rundown"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - rundown

volumes:
  pgdata:

networks:
  rundown:
    name: rundown
    driver: bridge
